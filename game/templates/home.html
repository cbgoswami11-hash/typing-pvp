<!DOCTYPE html>
<html>
<head>
    <title>Typing PvP</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #111;
            color: white;
        }

        #box {
            width: 60%;
            margin: auto;
            padding: 20px;
            background: #222;
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 100px;
            font-size: 18px;
            margin-top: 15px;
        }

        .progress {
            margin-top: 15px;
        }

        .bar {
            height: 20px;
            background: lime;
            width: 0%;
        }

        #enemyBar {
            background: red;
        }
    </style>
</head>
<body>

<div id="box">
    <h2>⚔ Online Typing PvP ⚔</h2>
    <p id="text">The quick brown fox jumps over the lazy dog.</p>

    <textarea id="input" placeholder="Start typing..."></textarea>

    <div class="progress">
        <p>Your Progress</p>
        <div style="background:#555;">
            <div id="myBar" class="bar"></div>
        </div>
    </div>

    <div class="progress">
        <p>Opponent Progress</p>
        <div style="background:#555;">
            <div id="enemyBar" class="bar"></div>
        </div>
    </div>

    <h3 id="result"></h3>
</div>

<script>
const text = document.getElementById("text").innerText;
const input = document.getElementById("input");
const myBar = document.getElementById("myBar");
const enemyBar = document.getElementById("enemyBar");
const result = document.getElementById("result");

const socket = new WebSocket(
    'ws://' + window.location.host + '/ws/typing/'
);

input.addEventListener("input", function() {

    let correctChars = 0;

    for (let i = 0; i < input.value.length; i++) {
        if (input.value[i] === text[i]) {
            correctChars++;
        } else {
            break;  // stop at first mistake
        }
    }

    let progress = (correctChars / text.length) * 100;
    myBar.style.width = progress + "%";

    socket.send(JSON.stringify({
        "progress": progress
    }));

    if (correctChars === text.length) {
        result.innerText = "🏆 You Win!";
        input.disabled = true;
    }
});

socket.onmessage = function(e) {
    let data = JSON.parse(e.data);
    enemyBar.style.width = data.progress + "%";
};
</script>

</body>
</html>
